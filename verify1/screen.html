<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카테고리 분류 검증 담당</title>
<style>
  body {
    background: #ffffff;
    color: #000000;
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    margin: 0;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  .notice {
    border: 2px solid #000000;
    padding: 12px 16px;
    margin-bottom: 28px;
    font-size: 16px;
  }

  h1 { font-size: 30px; margin: 0 0 28px; }
  h2 { font-size: 21px; margin: 32px 0 12px; }

  /* 입력 자리 — 파일을 끌어다 놓는 칸 */
  .drop {
    border: 2px dashed #666666;
    padding: 44px 20px;
    text-align: center;
    color: #333333;
    cursor: pointer;
  }
  .drop.over { border-color: #000000; background: #f2f2f2; }
  .drop .file { margin-top: 10px; font-weight: bold; }

  /* 입력 칸 — 검증할 글을 직접 넣는 칸 */
  #inputText {
    width: 100%;
    box-sizing: border-box;
    margin-top: 12px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    border: 1px solid #999999;
  }

  button {
    font-family: inherit;
    font-size: 18px;
    padding: 12px 32px;
    margin-top: 20px;
    border: 2px solid #000000;
    background: #ffffff;
    color: #000000;
    cursor: pointer;
  }
  button:hover { background: #000000; color: #ffffff; }

  #result { margin-top: 12px; }
  .hidden { display: none; }

  #output {
    border: 1px solid #999999;
    background: #f9f9f9;
    padding: 16px 18px;
    margin: 8px 0 20px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .summary { margin: 8px 0 20px; }

  /* 표는 표 모양 그대로 */
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  th, td {
    border: 1px solid #999999;
    padding: 9px 11px;
    text-align: left;
    vertical-align: top;
    font-size: 16px;
  }
  th { background: #f2f2f2; }
  .scroll { overflow-x: auto; }

  /* 판정 색 — 반려는 빨강, 확인 대상 없음은 파랑 */
  .reject { color: #c00000; font-weight: bold; }
  .none   { color: #0033cc; font-weight: bold; }

  .memo { font-size: 15px; color: #333333; }

  /* 지휘에게 보내는 결과 보고 — 산출물 표와 구분되는 자리 */
  .report {
    border: 1px solid #999999;
    background: #f9f9f9;
    padding: 16px 18px;
    margin: 8px 0 20px;
  }
  .report pre {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="notice">실제로 담당자를 부릅니다</p>

  <h1>카테고리 분류 검증 담당</h1>

  <!-- 입력 자리 -->
  <div class="drop" id="drop">
    가공된 거래 표 파일을 이곳에 끌어다 놓으세요
    <div class="file" id="fileName"></div>
  </div>
  <textarea id="inputText" rows="10" placeholder="검증할 글을 이곳에 붙여넣으세요"></textarea>

  <!-- 누르는 자리 -->
  <button id="runBtn">검증하기</button>

  <!-- 결과 자리 -->
  <div id="result" class="hidden">

    <h2>판정 결과</h2>
    <div class="scroll">
      <pre id="output"></pre>
    </div>

  </div>

</div>

<script>
  var drop = document.getElementById('drop');
  var fileName = document.getElementById('fileName');
  var inputText = document.getElementById('inputText');
  var runBtn = document.getElementById('runBtn');
  var result = document.getElementById('result');
  var output = document.getElementById('output');

  // 끌어다 놓기 — 연습용이라 파일 내용을 읽지 않고 이름만 표시한다
  drop.addEventListener('dragover', function (e) {
    e.preventDefault();
    drop.classList.add('over');
  });
  drop.addEventListener('dragleave', function () {
    drop.classList.remove('over');
  });
  drop.addEventListener('drop', function (e) {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files.length > 0) {
      fileName.textContent = e.dataTransfer.files[0].name;
    }
  });

  // 검증하기 — 입력 칸의 글을 call-agent에 넘기고, 돌아온 결과를 결과 자리에 보여준다
  runBtn.addEventListener('click', function () {
    result.classList.remove('hidden');
    output.textContent = '부르는 중...';

    fetch('call-agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: inputText.value })
    })
      .then(function (res) {
        if (!res.ok) {
          throw new Error('요청 실패: ' + res.status);
        }
        return res.text();
      })
      .then(function (text) {
        output.textContent = text;
      })
      .catch(function (err) {
        output.textContent = '오류: ' + err.message;
      });
  });
</script>
</body>
</html>
