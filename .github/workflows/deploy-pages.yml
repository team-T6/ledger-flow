# 쇼케이스 페이지(web/)를 GitHub Pages로 배포한다.
# 브랜치 운용: demo = GitHub Pages 데모 배포용 상시 브랜치 (main·production과 별도).
# 사전 조건: repo Settings → Pages → Source를 "GitHub Actions"로 설정.
name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [demo]
    paths: ["web/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
