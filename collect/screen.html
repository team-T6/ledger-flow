<script>
// 표준 산출물 컬럼만 담은 헤더 — 미리 넣어둔 결과 행은 없음
const RESULT_CSV = `transaction_id,날짜,지출,수익,결제처,비고,결제수단,결제자,source_type,collect_status,구매항목
`;

// 하나카드 원본(카드사 CSV) 컬럼 — collect.py와 같은 순서
const HANA_RAW_HEADER = ["이용일자", "이용가맹점", "이용금액", "할부기간", "회차", "원금", "수수료", "이용혜택", "혜택금액", "결제후잔액", "포인트"];

let COLUMNS = null;   // 표준 산출물 컬럼 (처음 로드할 때 RESULT_CSV 헤더에서 뽑는다)
let dataRows = null;  // 표준 산출물 행들 (객체 배열)
const filters = {};   // 컬럼명 -> 필터 텍스트

// ---------- CSV 파싱 ----------

// 아주 단순한 CSV 파서 (따옴표로 감싼 콤마 포함 필드 처리)
function parseCSV(text, delimiter) {
  delimiter = delimiter || ",";
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const lines = text.replace(/\r\n/g, "\n");

  for (let i = 0; i < lines.length; i++) {
    const c = lines[i];
    if (inQuotes) {
      if (c === '"') {
        if (lines[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === delimiter) {
        row.push(field);
        field = "";
      } else if (c === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }
  }
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter(r => r.length > 1 || r[0] !== "");
}

function csvToObjects(text, delimiter) {
  const rows = parseCSV(text.trim(), delimiter);
  if (rows.length === 0) return { header: [], records: [] };
  const header = rows[0];
  const records = rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
    return obj;
  });
  return { header, records };
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// 이미지 파일을 서버로 보낼 base64 문자열로 바꾼다 (data: 접두어는 뗀다).
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// 이미 메모리에 있는 바이트 배열(xlsx-input에서 읽은 파일)을 서버로 보낼 base64로 바꾼다.
// 큰 파일에서 콜스택이 넘치지 않게 청크 단위로 처리한다.
function bytesToBase64(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// ---------- 표준 거래 id ----------

// 같은 날짜(YYMMDD)에 이미 있는 tx_id 중 가장 큰 순번 다음 번호를 돌려준다.
function nextTxId(dateStr) {
  const yymmdd = dateStr.slice(2).replace(/-/g, "");
  let maxSeq = 0;
  dataRows.forEach(r => {
    const m = /^tx_(\d{6})_(\d{2})$/.exec(r.transaction_id);
    if (m && m[1] === yymmdd) {
      maxSeq = Math.max(maxSeq, parseInt(m[2], 10));
    }
  });
  const seq = String(maxSeq + 1).padStart(2, "0");
  return `tx_${yymmdd}_${seq}`;
}

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

// ---------- 중복(겹침) 감지 ----------
// 영수증·엑셀 등 서로 다른 경로로 같은 거래가 두 번 들어오는 경우를 잡는다
// (collect.md "하는 단계 5·6" — 날짜+금액+결제처 기준 매칭, 불명확하면 review).

function normalizeMerchant(s) {
  return String(s || "").replace(/\s+/g, "").toLowerCase();
}

function rowAmount(row) {
  return (Number(row.지출) || 0) || (Number(row.수익) || 0);
}

// candidate와 날짜·금액이 같고 결제처가 겹치는(포함 관계) 기존 행을 찾는다.
function findPotentialDuplicate(candidate) {
  const candMerchant = normalizeMerchant(candidate.결제처);
  const candAmount = rowAmount(candidate);
  if (!candidate.날짜 || !candAmount || !candMerchant) return null;
  return dataRows.find(r => {
    if (r === candidate) return false;
    if (r.날짜 !== candidate.날짜 || rowAmount(r) !== candAmount) return false;
    const rMerchant = normalizeMerchant(r.결제처);
    return rMerchant && (rMerchant.includes(candMerchant) || candMerchant.includes(rMerchant));
  }) || null;
}

// dataRows에 새 행을 추가하기 전에 겹치는 기존 거래가 있는지 확인하고, 있으면
// 확정 상태를 확인 필요로 낮춰 사람이 같은 거래인지 판단하게 한다.
function pushRow(row) {
  const dup = findPotentialDuplicate(row);
  if (dup) {
    row.collect_status = "확인 필요";
    const note = `${dup.transaction_id}(${dup.source_type})와 날짜·금액·결제처가 겹침 — 같은 거래 중복 등록인지 확인 필요`;
    row.비고 = row.비고 ? `${row.비고} / ${note}` : note;
  }
  dataRows.push(row);
  return dup;
}

// ---------- 데이터 준비 ----------

function ensureLoaded() {
  if (dataRows === null) {
    const parsed = csvToObjects(RESULT_CSV);
    COLUMNS = parsed.header;
    dataRows = parsed.records;
    buildTableHead();
  }
}

// 하나카드 원본 CSV(카드사 Excel/CSV) 한 행을 표준 컬럼으로 정규화한다.
// collect.py의 normalize()와 같은 규칙 — 단, 매달 파일이 나뉘어 있다고 가정하지 않고
// 이용일자를 그대로 날짜로 쓴다(업로드 한 파일 = 한 시점 스냅샷이라는 단순화).
function normalizeHanaRow(raw) {
  const usageDate = raw["이용일자"];
  const merchant = raw["이용가맹점"];
  const amount = parseInt(raw["이용금액"], 10) || 0;
  const term = raw["할부기간"];
  const roundNo = raw["회차"];
  const principal = parseInt(raw["원금"], 10) || 0;
  const fee = parseInt(raw["수수료"], 10) || 0;
  const benefitLabel = raw["이용혜택"];
  const benefitAmt = parseInt(raw["혜택금액"], 10) || 0;

  const expense = principal + fee;
  let memo;
  if (term === "일시불") {
    memo = (benefitLabel && benefitLabel !== "없음") ? `${benefitLabel} ${benefitAmt.toLocaleString()}원` : "";
  } else {
    const [num, denom] = String(roundNo).split("/");
    const paidOff = num === denom ? " (완납)" : "";
    memo = `할부 ${roundNo} (원금 ${principal.toLocaleString()} + 수수료 ${fee.toLocaleString()}), 총액 ${amount.toLocaleString()}${paidOff}`;
  }

  return {
    transaction_id: nextTxId(usageDate),
    날짜: usageDate,
    지출: expense,
    수익: 0,
    결제처: merchant,
    비고: memo,
    결제수단: "하나카드",
    결제자: "개인카드",
    source_type: "card_excel",
    collect_status: "확인됨",
    구매항목: "",
  };
}

function headersMatch(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

function showFileMessage(text, isError) {
  const el = document.getElementById("file-message");
  el.textContent = text;
  el.className = isError ? "error" : "info";
}

// 낯선 서식(매핑 규칙 없는 표)을 담당자(AI)에게 넘겨 표준 형식 행 배열로 바꿔온다.
async function convertUnknownFormatWithAI(text) {
  const response = await fetch("/convert-table", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await response.json();
  if (!response.ok || data.error) {
    throw new Error(data.error || response.statusText);
  }
  return data.result;
}

// AI가 변환해 온 행들을 dataRows에 추가하고, 확인됨 건수를 돌려준다.
function pushAiConvertedRows(rows, sourceType) {
  let confirmedCount = 0;
  rows.forEach(r => {
    const date = r.날짜 || todayStr();
    pushRow({
      transaction_id: nextTxId(date),
      날짜: date,
      지출: r.지출 || 0,
      수익: r.수익 || 0,
      결제처: r.결제처 || "",
      비고: r.비고 || "",
      결제수단: r.결제수단 || "",
      결제자: r.결제자 || "",
      source_type: sourceType,
      collect_status: r.확인됨 ? "확인됨" : "확인 필요",
      구매항목: r.구매항목 || "",
    });
    if (r.확인됨) confirmedCount++;
  });
  return confirmedCount;
}

// ---------- 영수증 추가 ----------

document.getElementById("receipt-btn").addEventListener("click", function () {
  document.getElementById("receipt-input").click();
});

document.getElementById("receipt-input").addEventListener("change", async function (e) {
  const file = e.target.files[0];
  if (!file) return;
  ensureLoaded();

  const receiptBtn = document.getElementById("receipt-btn");
  receiptBtn.disabled = true;
  showFileMessage(`"${file.name}" 읽는 중...`, false);

  let row;
  let baseMessage;
  let baseIsError;
  try {
    const imageB64 = await fileToBase64(file);
    const response = await fetch("/read-receipt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageB64, media_type: file.type }),
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(data.error || response.statusText);
    }

    const ocr = data.result;
    const date = ocr.날짜 || todayStr();
    row = {
      transaction_id: nextTxId(date),
      날짜: date,
      지출: ocr.금액 || "",
      수익: 0,
      결제처: ocr.결제처 || "",
      비고: `영수증 자동 인식: ${file.name}`,
      결제수단: ocr.결제수단 || "",
      결제자: "",
      source_type: "receipt",
      collect_status: ocr.확인됨 ? "확인됨" : "확인 필요",
      구매항목: ocr.구매항목 || "",
    };
    baseIsError = row.collect_status !== "확인됨";
    baseMessage = `영수증 "${file.name}" — AI로 읽어서 ${baseIsError ? "확인 필요로 등록했습니다." : "등록했습니다."}`;
  } catch (err) {
    const date = todayStr();
    row = {
      transaction_id: nextTxId(date),
      날짜: date,
      지출: "",
      수익: "",
      결제처: "",
      비고: `영수증 업로드: ${file.name} (AI 인식 실패: ${err.message} — 확인 전이라 지어내지 않음)`,
      결제수단: "",
      결제자: "",
      source_type: "receipt",
      collect_status: "확인 필요",
      구매항목: "",
    };
    baseIsError = true;
    baseMessage = `영수증 "${file.name}" — AI 인식에 실패해 확인 필요로만 등록했습니다 (${err.message}).`;
  } finally {
    receiptBtn.disabled = false;
  }
  // 미리 등록된 영수증·엑셀 등과 날짜·금액·결제처가 겹치면, AI 인식 성공 여부와 무관하게
  // 중복 의심 쪽을 우선 알려준다 (pushRow가 collect_status·비고도 확인 필요로 맞춰 둔다).
  const dup = pushRow(row);
  if (dup) {
    showFileMessage(`영수증 "${file.name}" — ${dup.transaction_id}(${dup.source_type})와 날짜·금액·결제처가 겹쳐 중복 의심으로 등록했습니다. 같은 거래인지 확인해주세요.`, true);
  } else {
    showFileMessage(baseMessage, baseIsError);
  }
  afterDataChange();
  e.target.value = "";
});

// ---------- xlsx 등록 ----------

document.getElementById("xlsx-btn").addEventListener("click", function () {
  document.getElementById("xlsx-input").click();
});

document.getElementById("xlsx-input").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;
  ensureLoaded();

  const reader = new FileReader();
  reader.onload = async function () {
    const bytes = new Uint8Array(reader.result);

    // 진짜 바이너리 엑셀(xlsx=zip 시그니처 "PK", 구형 xls=OLE2 시그니처)은 브라우저가
    // 직접 텍스트로 읽을 수 없다 — 서버(/read-excel)가 xlrd·openpyxl로 대신 파싱해
    // CSV로 돌려준다. 텍스트로 디코딩을 시도하기 전에 원본 바이트로 먼저 판별한다.
    const isZipXlsx = bytes[0] === 0x50 && bytes[1] === 0x4B;
    const isOleXls = bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0;

    let text;
    if (isZipXlsx || isOleXls) {
      showFileMessage(`"${file.name}" — 엑셀 파일을 서버에서 읽는 중...`, false);
      try {
        const response = await fetch("/read-excel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data: bytesToBase64(bytes) }),
        });
        const data = await response.json();
        if (!response.ok || data.error) throw new Error(data.error || response.statusText);
        text = data.result.csv;
      } catch (err) {
        const date = todayStr();
        pushRow({
          transaction_id: nextTxId(date),
          날짜: date,
          지출: "",
          수익: "",
          결제처: "",
          비고: `카드사 파일 등록: ${file.name} (서버에서 엑셀을 읽지 못함: ${err.message} — 내용은 수동 입력으로 반영 필요)`,
          결제수단: "",
          결제자: "",
          source_type: "card_excel",
          collect_status: "확인 필요",
          구매항목: "",
        });
        showFileMessage(`"${file.name}" — 서버에서 엑셀을 읽지 못해 확인 필요로 등록만 해뒀습니다: ${err.message}`, true);
        afterDataChange();
        e.target.value = "";
        return;
      }
    } else {
      // 카드사 CSV는 UTF-8이 아니라 CP949(EUC-KR)로 저장되는 경우가 많다 — 무조건 UTF-8로
      // 읽으면 한글만 깨지고 영문·숫자만 남아 "인코딩 손상"으로 오인된다. UTF-8로 먼저
      // 시도해(엄격 모드) 깨지면 EUC-KR로 다시 읽는다.
      try {
        text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch (err) {
        text = new TextDecoder("euc-kr").decode(bytes);
      }
    }

    const { header, records } = csvToObjects(text);
    if (records.length > 0 && headersMatch(header, HANA_RAW_HEADER)) {
      records.forEach(r => pushRow(normalizeHanaRow(r)));
      showFileMessage(`"${file.name}" (하나카드 원본 형식) — ${records.length}건을 표준 형식으로 변환해 등록했습니다.`, false);
      afterDataChange();
      e.target.value = "";
      return;
    }
    if (records.length > 0 && headersMatch(header, COLUMNS)) {
      records.forEach(r => pushRow(r));
      showFileMessage(`"${file.name}" (이미 표준 형식) — ${records.length}건을 그대로 등록했습니다.`, false);
      afterDataChange();
      e.target.value = "";
      return;
    }

    // 알려진 두 형식 어디에도 안 맞으면 담당자(AI)에게 변환을 부탁한다.
    showFileMessage(`"${file.name}" — 알려진 형식이 아니라 담당자에게 변환을 부탁하는 중...`, false);
    const xlsxBtn = document.getElementById("xlsx-btn");
    xlsxBtn.disabled = true;
    try {
      const rows = await convertUnknownFormatWithAI(text);
      if (!rows || rows.length === 0) {
        showFileMessage(`"${file.name}" — 담당자가 이 내용에서 읽을 행을 찾지 못했습니다.`, true);
        return;
      }
      const confirmedCount = pushAiConvertedRows(rows, "card_excel_ai");
      showFileMessage(`"${file.name}" (담당자가 변환) — ${rows.length}건 등록 (그중 확인됨 ${confirmedCount}건, 확인 필요 ${rows.length - confirmedCount}건).`, confirmedCount < rows.length);
      afterDataChange();
    } catch (err) {
      showFileMessage(`"${file.name}" — 담당자 변환에 실패했습니다: ${err.message}`, true);
    } finally {
      xlsxBtn.disabled = false;
      e.target.value = "";
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = "";
});

// ---------- 정렬 ----------

const sortState = { column: null, dir: 0 }; // dir: 1 오름차순, -1 내림차순, 0 없음

function isNumericColumn(values) {
  return values.length > 0 && values.every(v => v === "" || /^-?\d+(\.\d+)?$/.test(String(v).trim()));
}

function compareValues(a, b, col, numeric) {
  const av = a[col] ?? "";
  const bv = b[col] ?? "";
  if (numeric) {
    const an = av === "" ? -Infinity : parseFloat(av);
    const bn = bv === "" ? -Infinity : parseFloat(bv);
    return an - bn;
  }
  return String(av).localeCompare(String(bv), "ko");
}

function updateSortIndicators() {
  document.querySelectorAll("#header-row th").forEach(th => {
    const col = th.dataset.col;
    const arrow = th.querySelector(".sort-arrow");
    if (!arrow) return;
    arrow.textContent = col === sortState.column ? (sortState.dir === 1 ? " ▲" : " ▼") : "";
  });
}

// ---------- 표 렌더링 (필터·정렬 포함) ----------

function buildTableHead() {
  const resultEl = document.getElementById("result");
  resultEl.innerHTML =
    '<table id="data-table">' +
    '<thead>' +
    '<tr id="header-row"></tr>' +
    '<tr id="filter-row"></tr>' +
    '</thead>' +
    '<tbody id="table-body"></tbody>' +
    '</table>';

  const headerRow = document.getElementById("header-row");
  const filterRow = document.getElementById("filter-row");

  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    th.className = "sortable";
    th.dataset.col = col;
    const label = document.createElement("span");
    label.textContent = col;
    const arrow = document.createElement("span");
    arrow.className = "sort-arrow";
    th.appendChild(label);
    th.appendChild(arrow);
    th.title = "클릭하면 이 컬럼 기준으로 오름차순/내림차순 정렬됩니다";
    th.addEventListener("click", function () {
      if (sortState.column === col) {
        sortState.dir = sortState.dir === 1 ? -1 : (sortState.dir === -1 ? 0 : 1);
        if (sortState.dir === 0) sortState.column = null;
      } else {
        sortState.column = col;
        sortState.dir = 1;
      }
      updateSortIndicators();
      renderBody();
    });
    headerRow.appendChild(th);

    const filterTh = document.createElement("th");
    filterTh.className = "filter-cell";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "검색 필터";
    input.addEventListener("input", function () {
      filters[col] = input.value;
      renderBody();
    });
    filterTh.appendChild(input);
    filterRow.appendChild(filterTh);
  });

  // 데이터 컬럼이 아닌 동작 칸 — 행별로 구매내역 영수증을 붙여 구매항목을 채운다.
  const actionTh = document.createElement("th");
  actionTh.textContent = "영수증";
  actionTh.title = "구매내역 영수증 이미지를 올리면 이 행의 구매항목을 채웁니다";
  headerRow.appendChild(actionTh);
  filterRow.appendChild(document.createElement("th"));
}

function renderBody() {
  const tbody = document.getElementById("table-body");
  let filtered = dataRows.filter(row =>
    COLUMNS.every(col => {
      const f = (filters[col] || "").trim().toLowerCase();
      if (!f) return true;
      return String(row[col] ?? "").toLowerCase().includes(f);
    })
  );

  if (sortState.column) {
    const numeric = isNumericColumn(dataRows.map(r => r[sortState.column]));
    filtered = filtered.slice().sort((a, b) => compareValues(a, b, sortState.column, numeric) * sortState.dir);
  }

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${COLUMNS.length + 1}">표시할 내용이 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = "";
  filtered.forEach(row => {
    const tr = document.createElement("tr");
    if (row.collect_status === "확인 필요") tr.className = "needs-check";

    COLUMNS.forEach(col => {
      const td = document.createElement("td");
      td.textContent = row[col] ?? "";
      // transaction_id는 다른 곳에서 참조하는 식별자라 고치지 못하게 둔다.
      if (col !== "transaction_id") {
        td.classList.add("editable-cell");
        td.title = "클릭하면 값을 고칠 수 있습니다";
        td.addEventListener("click", function () { startEditCell(td, row, col); });
      }
      tr.appendChild(td);
    });

    // 모든 행에 영수증을 다 넣을 수는 없으니, 구매항목이 비어 있는 행에만 첨부 버튼을 보여준다
    // (구매항목이 이미 있으면 어차피 표의 그 셀을 클릭해 직접 고칠 수 있다).
    const actionTd = document.createElement("td");
    if (!row.구매항목) {
      const receiptBtn = document.createElement("button");
      receiptBtn.type = "button";
      receiptBtn.className = "row-receipt-btn";
      receiptBtn.textContent = "영수증";
      receiptBtn.title = "구매내역 영수증 이미지를 올리거나, 표의 구매항목 칸을 클릭해 직접 입력하세요";
      receiptBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        attachReceiptToRow(row);
      });
      actionTd.appendChild(receiptBtn);
    }
    tr.appendChild(actionTd);

    tbody.appendChild(tr);
  });
}

// 결제처만으론 뭘 샀는지 알 수 없어 확인 필요로 남은 행에, 실제 구매내역 영수증을 붙여
// 구매항목만 채운다 (날짜·금액·결제처는 이미 카드 내역으로 확정돼 있으니 건드리지 않는다).
function attachReceiptToRow(row) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.addEventListener("change", async function () {
    const file = input.files[0];
    if (!file) return;
    showFileMessage(`"${file.name}" — 영수증에서 구매항목을 읽는 중...`, false);
    try {
      const imageB64 = await fileToBase64(file);
      const response = await fetch("/read-receipt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: imageB64, media_type: file.type }),
      });
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data.error || response.statusText);

      const ocr = data.result;
      if (!ocr.구매항목) {
        showFileMessage(`"${file.name}" — 영수증에서 구매 항목을 읽지 못했습니다. 직접 입력해주세요.`, true);
        return;
      }
      row.구매항목 = ocr.구매항목;
      row.collect_status = "확인됨";
      row.비고 = row.비고 ? `${row.비고} / 영수증으로 구매항목 확인: ${file.name}` : `영수증으로 구매항목 확인: ${file.name}`;
      showFileMessage(`"${file.name}" — 구매항목을 "${ocr.구매항목}"(으)로 채웠습니다.`, false);
      afterDataChange();
    } catch (err) {
      showFileMessage(`"${file.name}" — 영수증 인식에 실패했습니다: ${err.message}`, true);
    }
  });
  input.click();
}

// 셀을 입력칸(상태 컬럼은 드롭다운)으로 바꿔서 값을 고치게 한다.
// filtered는 dataRows와 같은 객체를 참조하므로, row[col]을 바꾸면 dataRows도 바로 바뀐다.
function startEditCell(td, row, col) {
  if (td.querySelector("input, select")) return; // 이미 편집 중

  const currentValue = row[col] ?? "";
  let input;
  if (col === "collect_status") {
    input = document.createElement("select");
    ["확인됨", "확인 필요"].forEach(opt => {
      const optionEl = document.createElement("option");
      optionEl.value = opt;
      optionEl.textContent = opt;
      if (opt === currentValue) optionEl.selected = true;
      input.appendChild(optionEl);
    });
  } else {
    input = document.createElement("input");
    input.type = "text";
    input.value = currentValue;
  }

  td.textContent = "";
  td.appendChild(input);
  input.focus();
  if (input.select) input.select();

  let done = false;
  function finish(save) {
    if (done) return;
    done = true;
    if (save) row[col] = input.value;
    renderBody();
    if (save) saveResultAndReport();
  }

  input.addEventListener("blur", () => finish(true));
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      finish(true);
    } else if (e.key === "Escape") {
      finish(false);
    }
  });
}

function afterDataChange() {
  renderBody();
  saveResultAndReport();
}

document.getElementById("check-btn").addEventListener("click", async function () {
  const inputText = document.getElementById("input-text").value;
  const resultEl = document.getElementById("result");
  const btn = document.getElementById("check-btn");

  if (inputText.trim() === "") {
    resultEl.innerHTML = '<span class="placeholder">넣을 글이 없습니다</span>';
    return;
  }

  resultEl.innerHTML = '<span class="placeholder">부르는 중...</span>';
  btn.disabled = true;

  try {
    const response = await fetch("/call-agent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: inputText }),
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      resultEl.innerHTML = `<span class="placeholder">오류: ${escapeHtml(data.error || response.statusText)}</span>`;
    } else {
      resultEl.innerHTML = `<pre style="white-space:pre-wrap; word-break:break-word;">${escapeHtml(data.result)}</pre>` +
        `<div style="margin-top:8px; font-size:13px; color:#666;">이번 호출: 보낸 글자 ${inputText.length}자 · 받은 글자 ${data.result.length}자</div>`;
    }
  } catch (err) {
    resultEl.innerHTML = `<span class="placeholder">오류: ${escapeHtml(err.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
});

// ---------- 오케스트레이터용 단계 결과 보고 ----------
// interface-spec.md "단계 결과 보고" envelope 형식 그대로 (stage/status/output/counts/flags/message).
// 지금까지 이 화면에서 등록된 데이터(영수증·수동 입력·xlsx 포함) 기준으로 매번 새로 계산한다.

function buildOrchestratorReport() {
  const rows = dataRows || [];
  const total = rows.length;
  const ok = rows.filter(r => r.collect_status === "확인됨").length;
  const flagged = total - ok;

  let status;
  if (total === 0) status = "empty";
  else if (flagged === 0) status = "ok";
  else status = "partial";

  const flags = [];
  rows.forEach((r, i) => {
    if (r.collect_status !== "확인됨") {
      const base = `${r.결제처 || "출처 미상"} 거래 — ${r.collect_status} 상태`;
      // source_type이 receipt/카드사 파일 등록처럼 비고 자체가 사유 설명인 경우만 비고를 그대로 쓰고,
      // 그 외(포인트 적립 등 사유와 무관한 메모)는 참고로만 덧붙인다.
      const explainsItself = r.source_type === "receipt" || (r.비고 || "").startsWith("카드사 파일 등록");
      flags.push({
        row: i + 1,
        type: "확인 필요",
        reason: explainsItself ? r.비고 : (r.비고 ? `${base} (비고: ${r.비고})` : base)
      });
    }
  });

  return {
    stage: "collect",
    status: status,
    output: total > 0 ? "collect/result.csv" : "",
    counts: { total: total, ok: ok, flagged: flagged },
    flags: flags,
    message: total === 0 ? "수집 대상 없음" : ""
  };
}

function rowsToCSVField(value) {
  const s = String(value ?? "");
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function rowsToCSV(rows) {
  const lines = [COLUMNS.map(rowsToCSVField).join(",")];
  rows.forEach(row => lines.push(COLUMNS.map(col => rowsToCSVField(row[col])).join(",")));
  return lines.join("\n") + "\n";
}

// 결과물(표)이 나올 때마다 collect/result.csv로 저장한다.
// 단계 결과 보고는 파일로 남기지 않는다 — 파이프라인 실행 시 수집 호출의 응답으로
// 지휘에게 직접 전달한다 (interface-spec.md §단계 결과 보고 전달 방식 확정).
// 아래 "보고 만들기" 버튼은 그 보고의 미리보기·복사용이다.
async function saveResultAndReport() {
  if (!dataRows || dataRows.length === 0) return;

  const csv = rowsToCSV(dataRows);

  try {
    const response = await fetch("/save-result", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ csv }),
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      throw new Error(data.error || response.statusText);
    }
    showFileMessage("collect/result.csv에 저장했습니다.", false);
  } catch (err) {
    showFileMessage(`결과 저장에 실패했습니다: ${err.message}`, true);
  }
}

document.getElementById("report-btn").addEventListener("click", function () {
  ensureLoaded();
  const report = buildOrchestratorReport();
  document.getElementById("report-output").textContent = JSON.stringify(report, null, 2);
});

document.getElementById("report-copy-btn").addEventListener("click", async function () {
  const text = document.getElementById("report-output").textContent;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    showFileMessage("보고 내용을 클립보드에 복사했습니다.", false);
  } catch (err) {
    showFileMessage("자동 복사에 실패했습니다 — 보고 내용을 직접 선택해서 복사해주세요.", true);
  }
});
</script>
