<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>지휘 담당</title>
<style>
  body {
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.6;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .notice {
    background: #f2f2f2;
    border: 1px solid #ccc;
    padding: 10px 14px;
    margin-bottom: 24px;
    font-size: 14px;
    color: #333333;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .preset-groups {
    margin-bottom: 12px;
  }
  .preset-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .preset-stage-label {
    display: inline-block;
    width: 56px;
    flex-shrink: 0;
    font-size: 13px;
    color: #555555;
  }
  .chip {
    font-size: 13px;
    padding: 4px 12px;
    background: #ffffff;
    color: #000000;
    border: 1px solid #999999;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 0;
  }
  .chip:hover {
    background: #eeeeee;
  }
  .chip.active {
    background: #000000;
    color: #ffffff;
    border-color: #000000;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    height: 200px;
    font-size: 15px;
    font-family: inherit;
    padding: 10px;
    border: 1px solid #999;
    margin-bottom: 16px;
  }
  button {
    font-size: 16px;
    padding: 10px 24px;
    background: #000000;
    color: #ffffff;
    border: none;
    cursor: pointer;
    margin-bottom: 24px;
  }
  button:hover {
    background: #333333;
  }
  #result {
    border: 1px solid #ccc;
    padding: 16px;
    min-height: 60px;
  }
  #result table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0 20px 0;
  }
  #result th, #result td {
    border: 1px solid #999;
    padding: 6px 10px;
    text-align: left;
    font-size: 15px;
  }
  #result th {
    background: #f2f2f2;
  }
  #result h1, #result h2, #result h3 {
    margin-top: 20px;
    margin-bottom: 8px;
  }
  #result p {
    margin: 8px 0;
  }
  #result ul {
    margin: 8px 0;
  }
  .placeholder {
    color: #888888;
  }
</style>
</head>
<body>

<div class="notice">연습용 화면 - 아직 실제로 처리하지 않고, 미리 넣어둔 결과를 보여줍니다</div>

<h1>지휘 담당</h1>

<label for="report-input">단계 결과 보고 형식</label>
<div class="preset-groups" id="preset-groups"></div>
<textarea id="report-input"></textarea>

<button id="check-btn">확인하기</button>

<div id="result"><span class="placeholder">확인하기 버튼을 누르면 결과가 여기에 표시됩니다.</span></div>

<script>
// orchestrator/result.md 내용을 그대로 담아둔 문자열
const RESULT_MD = `# 최종 결과 요약 (2026-07 결산)

## 1. 단계별 진행 현황

| 단계 | 상태 | 처리 건수 (전체/정상/확인필요) | 산출물 |
|---|---|---|---|
| 수집 | ok | 128 / 128 / 0 | collect/result.csv |
| 가공 | partial | 128 / 124 / 4 | refine/result.xlsx |
| 검증 1 | partial | 128 / 125 / 3 | verify1/result.xlsx |
| 검증 2 | ok | 128 / 128 / 0 | verify2/result.xlsx |
| 통합 | ok | 128 / 128 / 0 | merge/result.xlsx, merge/result.pdf |

## 2. 확인 필요 목록

| 행 번호 | 유형 | 사유 |
|---|---|---|
| 12 | 확인 필요 | 가맹점 식별 불가 |
| 47 | 확인 필요 | 카테고리 자동 분류 실패 |
| 63 | 반려 | 카테고리 체계와 불일치 |
| 89 | 반려 | 결제자 구분(개인/법인) 미기재 |
| 101 | 확인 필요 | 해외결제 환율 적용 불명확 |

## 3. 산출물 위치

- 엑셀 회계장부: \`merge/result.xlsx\`
- PDF 결산 리포트: \`merge/result.pdf\`

## 4. 메모

전 단계 \`counts.total\`(128건) 대조 결과 유실 없음. 확인 필요 5건은 산출물에서 별도 표시된 상태로 전달됨.
`;

// 단계 x 상태(4개 고정 어휘: ok/empty/partial/failed) 조합별 "단계 결과 보고" 프리셋
const STAGES = [
  { key: "collect", label: "수집", output: "collect/202608_transactions.csv", total: 128, flagType: "오류", flagReason: "OCR 금액 인식 실패", failMessage: "카드사 원본 파일 형식을 인식하지 못함" },
  { key: "refine", label: "가공", output: "refine/result.xlsx", total: 128, flagType: "확인 필요", flagReason: "가맹점 식별 불가", failMessage: "카테고리 체계 파일 로드 실패" },
  { key: "verify1", label: "검증 1", output: "verify1/result.xlsx", total: 128, flagType: "반려", flagReason: "카테고리 체계와 불일치", failMessage: "카테고리 체계 파일을 찾을 수 없음" },
  { key: "verify2", label: "검증 2", output: "verify2/result.xlsx", total: 128, flagType: "반려", flagReason: "해외결제 환율 적용 오류", failMessage: "기준 환율 파일 누락" },
  { key: "merge", label: "통합", output: ["merge/result.xlsx", "merge/result.pdf"], total: 128, flagType: "미완", flagReason: "검증 반려 건 미해결로 확인 필요 처리", failMessage: "장부 템플릿 파일 손상" }
];

const STATUSES = [
  { key: "ok", label: "정상" },
  { key: "empty", label: "대상없음" },
  { key: "partial", label: "확인필요" },
  { key: "failed", label: "실패" }
];

function buildReport(stage, statusKey) {
  const emptyOutput = Array.isArray(stage.output) ? [] : "";
  const base = { stage: stage.key, status: statusKey, output: stage.output, counts: { total: stage.total, ok: stage.total, flagged: 0 }, flags: [], message: "" };

  if (statusKey === "ok") {
    return base;
  }
  if (statusKey === "empty") {
    return { ...base, output: emptyOutput, counts: { total: 0, ok: 0, flagged: 0 }, message: "처리할 대상 없음" };
  }
  if (statusKey === "partial") {
    const flagged = 3;
    return {
      ...base,
      counts: { total: stage.total, ok: stage.total - flagged, flagged: flagged },
      flags: [{ row: 12, type: stage.flagType, reason: stage.flagReason }]
    };
  }
  if (statusKey === "failed") {
    return { ...base, output: emptyOutput, counts: { total: 0, ok: 0, flagged: 0 }, message: stage.failMessage };
  }
}

function renderPresets() {
  const container = document.getElementById("preset-groups");
  STAGES.forEach(function (stage) {
    const group = document.createElement("div");
    group.className = "preset-group";

    const stageLabel = document.createElement("span");
    stageLabel.className = "preset-stage-label";
    stageLabel.textContent = stage.label;
    group.appendChild(stageLabel);

    STATUSES.forEach(function (status) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = status.label;
      chip.dataset.stage = stage.key;
      chip.dataset.status = status.key;
      chip.addEventListener("click", function () {
        document.getElementById("report-input").value = JSON.stringify(buildReport(stage, status.key), null, 2);
        document.querySelectorAll(".chip.active").forEach(function (el) { el.classList.remove("active"); });
        chip.classList.add("active");
      });
      group.appendChild(chip);
    });

    container.appendChild(group);
  });
}

renderPresets();
document.querySelector('.chip[data-stage="collect"][data-status="ok"]').click();

// 아주 단순한 마크다운 -> HTML 변환 (제목 / 표 / 목록 / 문단만 처리)
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function inline(text) {
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    return text;
  }

  while (i < lines.length) {
    const line = lines[i];

    if (/^#{1,3}\s+/.test(line)) {
      const level = line.match(/^#+/)[0].length;
      const text = line.replace(/^#{1,3}\s+/, "");
      html += `<h${level}>${inline(text)}</h${level}>\n`;
      i++;
      continue;
    }

    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const headerCells = line.split("|").slice(1, -1).map(c => c.trim());
      html += "<table>\n<thead><tr>";
      headerCells.forEach(c => html += `<th>${inline(c)}</th>`);
      html += "</tr></thead>\n<tbody>\n";
      i += 2;
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].split("|").slice(1, -1).map(c => c.trim());
        html += "<tr>";
        cells.forEach(c => html += `<td>${inline(c)}</td>`);
        html += "</tr>\n";
        i++;
      }
      html += "</tbody>\n</table>\n";
      continue;
    }

    if (/^-\s+/.test(line)) {
      html += "<ul>\n";
      while (i < lines.length && /^-\s+/.test(lines[i])) {
        html += `<li>${inline(lines[i].replace(/^-\s+/, ""))}</li>\n`;
        i++;
      }
      html += "</ul>\n";
      continue;
    }

    if (line.trim() === "") {
      i++;
      continue;
    }

    html += `<p>${inline(line)}</p>\n`;
    i++;
  }

  return html;
}

document.getElementById("check-btn").addEventListener("click", function () {
  document.getElementById("result").innerHTML = renderMarkdown(RESULT_MD);
});
</script>

</body>
</html>
