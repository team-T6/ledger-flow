<div id="resultArea" style="display:none;"></div>

// refine/server.py가 열어주는 로컬 주소 — 열쇠는 여기(화면)가 아니라
// call-agent.py 쪽에서만 .env를 읽어 쓴다
var SERVER_URL = 'http://localhost:8789/call-agent';

function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function parseCsvLine(line) {
  var result = [];
  var cur = "";
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === "\"") {
        if (line[i + 1] === "\"") { cur += "\""; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if (ch === "\"") { inQuotes = true; }
      else if (ch === ",") { result.push(cur); cur = ""; }
      else { cur += ch; }
    }
  }
  result.push(cur);
  return result;
}

function parseCsv(text) {
  var lines = text.split("\n").filter(function (l) { return l.length > 0; });
  var headers = parseCsvLine(lines[0]);
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    rows.push(parseCsvLine(lines[i]));
  }
  return { headers: headers, rows: rows };
}

function buildTableHtml(headers, rows) {
  var html = "<table><tr>";
  for (var h = 0; h < headers.length; h++) {
    html += "<th>" + escapeHtml(headers[h]) + "</th>";
  }
  html += "</tr>";
  for (var r = 0; r < rows.length; r++) {
    html += "<tr>";
    for (var c = 0; c < rows[r].length; c++) {
      html += "<td>" + escapeHtml(rows[r][c]) + "</td>";
    }
    html += "</tr>";
  }
  html += "</table>";
  return html;
}

var collectData = parseCsv(collectCsv);
document.getElementById("inputTable").innerHTML = buildTableHtml(collectData.headers, collectData.rows);
document.getElementById("inputText").value = collectCsv;

document.getElementById("checkBtn").addEventListener("click", function () {
  var resultArea = document.getElementById("resultArea");
  resultArea.style.display = "block";
  resultArea.textContent = "부르는 중";

  fetch(SERVER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ input: document.getElementById("inputText").value })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.error) {
        resultArea.textContent = "오류: " + data.error;
        return;
      }
      resultArea.textContent = data.result;
    })
    .catch(function (err) {
      resultArea.textContent = "호출 실패: " + err.message + " (refine/server.py가 실행 중인지 확인하세요)";
    });
});
</script>
