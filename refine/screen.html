function escapeHtml(text) {
  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderMarkdown(md) {
  var lines = md.split("\n");
  var html = "";
  var i = 0;
  var inList = false;

  function closeList() {
    if (inList) { html += "</ul>"; inList = false; }
  }

  while (i < lines.length) {
    var line = lines[i];

    if (line.indexOf("|") === 0) {
      closeList();
      var tableLines = [];
      while (i < lines.length && lines[i].indexOf("|") === 0) {
        tableLines.push(lines[i]);
        i++;
      }
      html += "<table>";
      for (var t = 0; t < tableLines.length; t++) {
        var cells = tableLines[t].split("|").slice(1, -1).map(function (c) { return c.trim(); });
        if (t === 1 && cells.every(function (c) { return /^-+$/.test(c); })) {
          continue;
        }
        var tag = t === 0 ? "th" : "td";
        html += "<tr>";
        for (var c = 0; c < cells.length; c++) {
          html += "<" + tag + ">" + escapeHtml(cells[c]) + "</" + tag + ">";
        }
        html += "</tr>";
      }
      html += "</table>";
      continue;
    }

    if (line.indexOf("## ") === 0) {
      closeList();
      html += "<h3>" + escapeHtml(line.slice(3)) + "</h3>";
      i++; continue;
    }
    if (line.indexOf("# ") === 0) {
      closeList();
      html += "<h2>" + escapeHtml(line.slice(2)) + "</h2>";
      i++; continue;
    }
    if (line.indexOf("> ") === 0) {
      closeList();
      html += "<blockquote>" + escapeHtml(line.slice(2)) + "</blockquote>";
      i++; continue;
    }
    if (line.indexOf("- ") === 0) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + escapeHtml(line.slice(2)) + "</li>";
      i++; continue;
    }
    if (line.trim() === "") {
      closeList();
      i++; continue;
    }
    closeList();
    html += "<p>" + escapeHtml(line) + "</p>";
    i++;
  }
  closeList();
  return html;
}

function splitMarkdownTable(md) {
  var lines = md.split("\n");
  var tableStart = -1, tableEnd = -1;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("|") === 0) {
      if (tableStart === -1) tableStart = i;
      tableEnd = i;
    } else if (tableStart !== -1) {
      break;
    }
  }
  var beforeText = lines.slice(0, tableStart).join("\n");
  var tableLines = lines.slice(tableStart, tableEnd + 1);
  var afterText = lines.slice(tableEnd + 1).join("\n");

  var headers = tableLines[0].split("|").slice(1, -1).map(function (c) { return c.trim(); });
  var rows = [];
  for (var t = 2; t < tableLines.length; t++) {
    var cells = tableLines[t].split("|").slice(1, -1).map(function (c) { return c.trim(); });
    rows.push(cells);
  }
  return { beforeText: beforeText, headers: headers, rows: rows, afterText: afterText };
}

function buildTableHtml(headers, rows) {
  var html = "<table><tr>";
  for (var h = 0; h < headers.length; h++) {
    html += "<th>" + escapeHtml(headers[h]) + "</th>";
  }
  html += "</tr>";
  for (var r = 0; r < rows.length; r++) {
    html += "<tr>";
    for (var c = 0; c < rows[r].length; c++) {
      html += "<td>" + escapeHtml(rows[r][c]) + "</td>";
    }
    html += "</tr>";
  }
  html += "</table>";
  return html;
}

function parseCsvLine(line) {
  var result = [];
  var cur = "";
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQuotes) {
      if (ch === "\"") {
        if (line[i + 1] === "\"") { cur += "\""; i++; }
        else { inQuotes = false; }
      } else {
        cur += ch;
      }
    } else {
      if (ch === "\"") { inQuotes = true; }
      else if (ch === ",") { result.push(cur); cur = ""; }
      else { cur += ch; }
    }
  }
  result.push(cur);
  return result;
}

function parseCsv(text) {
  var lines = text.split("\n").filter(function (l) { return l.length > 0; });
  var headers = parseCsvLine(lines[0]);
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    rows.push(parseCsvLine(lines[i]));
  }
  return { headers: headers, rows: rows };
}

var parsedData = splitMarkdownTable(resultMarkdown);
var collectData = parseCsv(collectCsv);

document.getElementById("inputTable").innerHTML = buildTableHtml(collectData.headers, collectData.rows);

document.getElementById("checkBtn").addEventListener("click", function () {
  var resultArea = document.getElementById("resultArea");
  resultArea.innerHTML =
    renderMarkdown(parsedData.beforeText) +
    buildTableHtml(parsedData.headers, parsedData.rows) +
    renderMarkdown(parsedData.afterText);
  resultArea.style.display = "block";
});
</script>
